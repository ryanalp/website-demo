```yaml
name: Build and Deploy Website

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Verify required files exist
        run: |
          test -f src/index.html || { echo "src/index.html missing"; exit 1; }
          test -f src/style.css || { echo "src/style.css missing"; exit 1; }
          test -f src/script.js || { echo "src/script.js missing"; exit 1; }
          echo "All required files present!"

      - name: Validate HTML structure
        run: |
          grep -qi '<!DOCTYPE html' src/index.html || { echo "Missing DOCTYPE"; exit 1; }
          grep -qi '<html' src/index.html || { echo "Missing html tag"; exit 1; }
          grep -qi '<head' src/index.html || { echo "Missing head tag"; exit 1; }
          grep -qi '<body' src/index.html || { echo "Missing body tag"; exit 1; }
          echo "HTML structure is valid!"

  build:
    name: Build
    runs-on: ubuntu-latest
    needs: test

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Create build directory
        run: |
          mkdir -p dist
          cp -r src/. dist/
          echo "Build complete!"

      - name: Add build info file
        run: |
          echo "Build Date: $(date -u)" > dist/build-info.txt
          echo "Commit SHA: $GITHUB_SHA" >> dist/build-info.txt
          echo "Branch: $GITHUB_REF_NAME" >> dist/build-info.txt
          echo "Triggered by: $GITHUB_ACTOR" >> dist/build-info.txt

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: website-build
          path: dist/
          retention-days: 7

  deploy:
    name: Deploy
    runs-on: ubuntu-latest
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Prepare site files
        run: |
          mkdir -p _site
          cp -r src/. _site/
          echo "Site ready for deployment"

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
```
